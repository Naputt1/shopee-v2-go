name: Weekly Generate
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate
      - id: check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - if: steps.check.outputs.changed == 'true'
        run: go build ./... && go vet ./... && go test ./...
      - if: steps.check.outputs.changed == 'true'
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "chore: regenerate from shopee api docs"
          LATEST=$(git tag --sort=-v:refname | head -n1 2>/dev/null || echo "v0.0.0")
          MAJOR=${LATEST#v}; MAJOR=${MAJOR%%.*}
          MINOR=${LATEST#v}; MINOR=${MINOR#*.}; MINOR=${MINOR%%.*}
          PATCH=${LATEST##*.}
          NEW_TAG="v$MAJOR.$MINOR.$((PATCH+1))"
          while git rev-parse "$NEW_TAG" >/dev/null 2>&1 || git ls-remote --tags origin "$NEW_TAG" | grep -q "$NEW_TAG"; do
            PATCH=$((PATCH+1))
            NEW_TAG="v$MAJOR.$MINOR.$((PATCH+1))"
          done
          git tag "$NEW_TAG"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin HEAD:main
          git push origin "$NEW_TAG"
