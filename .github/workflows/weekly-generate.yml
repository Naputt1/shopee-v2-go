name: Weekly Generate
on:
  schedule:
    - cron: "23 3 * * 1"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # GitHub's cron trigger can silently stop firing, so main pushes also
  # regenerate, at most once a week.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            last=$(git log -1 --format=%ct --grep='^chore: regenerate from' || true)
            if [ -n "$last" ] && [ $(( $(date +%s) - last )) -lt 604800 ]; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  generate:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate
      - id: check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.changed == 'true'
        run: go build ./... && go vet ./... && go test ./...
      - name: Commit, tag and push
        if: steps.check.outputs.changed == 'true'
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "chore: regenerate from shopee api docs"
          git fetch --tags --force
          LATEST=$(git tag --sort=-v:refname | head -n1)
          LATEST=${LATEST:-v0.0.0}
          MAJOR=${LATEST#v}; MAJOR=${MAJOR%%.*}
          MINOR=${LATEST#v}; MINOR=${MINOR#*.}; MINOR=${MINOR%%.*}
          PATCH=${LATEST##*.}
          NEW_TAG="v$MAJOR.$MINOR.$((PATCH+1))"
          while git rev-parse -q --verify "refs/tags/$NEW_TAG" >/dev/null; do
            PATCH=$((PATCH+1))
            NEW_TAG="v$MAJOR.$MINOR.$((PATCH+1))"
          done
          git tag "$NEW_TAG"
          git push --atomic origin HEAD:main "$NEW_TAG"
          echo "published $NEW_TAG"
